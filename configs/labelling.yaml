# Oracle labelling (experimental protocol, sections 5 and 6.2; decisions in section 13).
#
# One sample per prompt and cell (k = 1), with two extra samples on the noise subset.
# Caps: 4,096 tokens in think mode including the trace, 2,048 in no-think mode. A cap
# hit is a failure. Runs are model-major; each batch runs both modes as separate
# single-mode energy windows, alternating which mode goes first.

seed: 20260911
ollama_host: http://127.0.0.1:11434
request_timeout_s: 900
keep_alive: 30m
num_ctx: 8192
tokenizer_id: Qwen/Qwen3-0.6B
corpus: data/processed/corpus.jsonl
raw_dir: results/raw/labelling

models:
  - {size: 0.6b, tag: "qwen3:0.6b-q4_K_M", expected_context_length: 40960, min_free_vram_mb: 2000}
  - {size: 1.7b, tag: "qwen3:1.7b-q4_K_M", expected_context_length: 40960, min_free_vram_mb: 3000}
  - {size: 4b, tag: "qwen3:4b-q4_K_M", expected_context_length: 40960, min_free_vram_mb: 4500}
  - {size: 8b, tag: "qwen3:8b-q4_K_M", expected_context_length: 40960, min_free_vram_mb: 6500}

# Qwen3 recommended sampling per mode.
decoding:
  think: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0, num_predict: 4096}
  no_think: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, num_predict: 2048}

window:
  batch_size: 20        # prompts per batch; each batch runs both modes as separate windows
  tail_s: 6.0           # idle hold after the last generation; smoothed power needs ~5 s to decay
  tail_check_s: 2.0     # end of the tail inspected for another workload
  max_load_s: 1.0       # a generation that took longer to load reloaded the model
  max_gap_s: 1.0        # a longer telemetry gap is a stall or a system suspend; the window is rerun
  max_attempts: 4

session:
  settle_s: 10          # after warm-up, before the opening baseline
  baseline_s: 60
  end_baseline_s: 30

telemetry:
  interval_ms: 100

gpu_guard:
  max_util_pct: 15
  idle_required_s: 30   # continuous idle needed before a load or a rerun
  poll_s: 5
  log_every_s: 600
  placement_retries: 5

server:
  wait_s: 3600
  poll_s: 30

warmup:
  no_think: {prompt: "Reply with OK.", num_predict: 16}
  think: {prompt: "What is 17 + 25?", num_predict: 256}

stages:
  smoke: {select: pilot, per_family: 2, samples: [0], sizes: [0.6b, 1.7b], batch_size: 3, baseline_s: 10, end_baseline_s: 5, raw_dir: results/raw/labelling_smoke}
  pilot: {select: pilot, samples: [0]}
  main: {select: main, samples: [0]}
  noise: {select: noise, samples: [1, 2]}
  # Cap sensitivity (protocol 13.1): rerun a stratified sample of capped generations with an
  # 8,192-token cap. The context grows so that a 2,048-token prompt still fits.
  cap: {select: cells, cells_file: results/processed/cap_reruns.csv, samples: [0], variant: cap8192, num_ctx: 10240, decoding: {think: {num_predict: 8192}, no_think: {num_predict: 8192}}}
  # At 10,240 tokens of context Ollama holds only 92% of qwen3:8b in 8 GB of VRAM, so the 8B
  # reruns use 9,216, the largest tested context that places it fully. The longest 8B prompt
  # in the rerun sample is 371 tokens, so every rerun still has its full 8,192-token budget.
  cap_8b: {select: cells, cells_file: results/processed/cap_reruns.csv, sizes: [8b], samples: [0], variant: cap8192, num_ctx: 9216, decoding: {think: {num_predict: 8192}, no_think: {num_predict: 8192}}}
  # Probes (paper sections III-D and III-F), built by scripts/build_probes.py. Each asks for a
  # short reply whose first visible token's distribution, returned as log probabilities, is
  # the result; eight tokens leave room for any leading whitespace. Sampling is untruncated at
  # temperature 1, so the distribution is the model's own whether Ollama reports it before or
  # after the sampler's transforms.
  # Cascade verifier: every no-think answer on the P1 ladder below c8, checked by its own model.
  verify: {select: cells, corpus: results/raw/probes/verify_corpus.jsonl, cells_file: results/raw/probes/verify_cells.csv, samples: [0], variant: verify, raw_dir: results/raw/verify, batch_size: 50, request: {logprobs: true, top_logprobs: 20}, decoding: {no_think: {temperature: 1.0, top_p: 1.0, top_k: 0, min_p: 0.0, num_predict: 8}}}
  # R3: Qwen3-0.6B names the cheapest sufficient configuration, zero-shot and few-shot.
  route_zero: {select: cells, sizes: [0.6b], corpus: results/raw/probes/route_zero_corpus.jsonl, cells_file: results/raw/probes/route_zero_cells.csv, samples: [0], variant: route-zero, raw_dir: results/raw/route, batch_size: 50, request: {logprobs: true, top_logprobs: 20}, decoding: {no_think: {temperature: 1.0, top_p: 1.0, top_k: 0, min_p: 0.0, num_predict: 8}}}
  route_few: {select: cells, sizes: [0.6b], corpus: results/raw/probes/route_few_corpus.jsonl, cells_file: results/raw/probes/route_few_cells.csv, samples: [0], variant: route-few, raw_dir: results/raw/route, batch_size: 50, request: {logprobs: true, top_logprobs: 20}, decoding: {no_think: {temperature: 1.0, top_p: 1.0, top_k: 0, min_p: 0.0, num_predict: 8}}}
