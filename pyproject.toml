[project]
name = "arbiter"
version = "0.1.0"
description = "ARBITER: Adaptive Routing By Inferred Task Effort Requirements - joint model-tier and reasoning-effort routing for LLM serving"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - patent pending, do not redistribute" }

dependencies = [
    # --- numerics / classical ML ---
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "statsmodels>=0.14",
    "joblib>=1.3",
    # --- deep learning ---
    "torch>=2.11,<2.12",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "datasets>=2.20",
    "accelerate>=0.33",
    "sentencepiece>=0.2",
    "safetensors>=0.4",
    "sentence-transformers>=3.0",
    # --- local model pool ---
    "ollama>=0.3",
    # --- frontier judge (validation subset only) ---
    "openai>=1.40",
    "httpx>=0.27",
    # --- energy instrumentation ---
    "nvidia-ml-py>=12.555",
    "psutil>=5.9",
    # --- plotting ---
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # --- plumbing ---
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "tqdm>=4.66",
    "rich>=13.7",
    "typer>=0.12",
    "peft>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arbiter"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
